
services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ./src:/var/www/html
    environment:
      COMPOSER_HOME: /tmp/composer
      XDEBUG_MODE: "off"
      # Xdebug apagado por defecto; se activa con XDEBUG_MODE=debug
      XDEBUG_CONFIG: "client_host=host.docker.internal client_port=9003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - php
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en src/.env}"
      MYSQL_DATABASE: "${DB_DATABASE:?Define DB_DATABASE en src/.env}"
      MYSQL_USER: "${DB_USERNAME:?Define DB_USERNAME en src/.env}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Define DB_PASSWORD en src/.env}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/scripts:/scripts
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}"
          mysql --protocol=TCP -h 127.0.01
          -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" 
          -e "SELECT 1" >/dev/null 2>&1 
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s 

  node:
    image: node:22-bookworm-slim
    profiles: ["tools"]
    working_dir: /var/www/html
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ./src:/var/www/html
    environment:
      NPM_CONFIG_CACHE: /tmp/npm

volumes:
  dbdata:
